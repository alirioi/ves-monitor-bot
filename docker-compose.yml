services:
  # Base de Datos PostgreSQL nativa (Consumo ultra bajo ~40MB RAM)
  postgres:
    image: postgres:15-alpine
    container_name: dolarbot_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bot de Telegram (conexión directa a PostgreSQL vía pool nativo pg)
  bot:
    build: .
    container_name: dolarbot_app
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-supersecretpassword}@postgres:5432/postgres
      PORT: 8080
      TZ: America/Caracas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
